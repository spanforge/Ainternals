name: Calculation regression checks
on:
  pull_request:
  push:
    branches: [main, master]
jobs:
  workbook-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workbook-parity-evidence
          path: |
            docs/tco/parity-report.json
            docs/tco/workbook-traceability.md
